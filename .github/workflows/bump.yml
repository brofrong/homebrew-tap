name: Bump

# Points the cask at the latest SD Sync Immich release: its version and the
# DMG's SHA-256 from the release's checksums.txt. Runs a few times a day and
# on demand.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/sd-sync-immich.rb
          tag=$(gh release view --repo brofrong/sd-sync-iimich --json tagName --jq .tagName)
          version=${tag#v}
          sha=$(curl -fsSL "https://github.com/brofrong/sd-sync-iimich/releases/download/$tag/checksums.txt" \
            | awk '$2 == "SD-Sync-Immich.dmg" { print $1 }')
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! $sha =~ ^[0-9a-f]{64}$ ]]; then
            echo "unexpected release: tag $tag, sha256 '$sha'" >&2
            exit 1
          fi
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$cask"
          if git diff --quiet; then
            echo "already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd-sync-immich $version"
          git push
